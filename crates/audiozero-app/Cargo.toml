[package]
name = "audiozero-app"
description = "AudioZero desktop app (Rust rewrite, early)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
audiozero-engine = { path = "../audiozero-engine" }
audiozero-host = { path = "../audiozero-host" }
audiozero-mcp = { path = "../audiozero-mcp" }
cpal = "0.18.2"
midir = "0.11.1"
rtrb = "0.4.1"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[[bin]]
name = "audiozero"
path = "src/main.rs"
