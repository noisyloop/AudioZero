# Keeps CI actions and Cargo dependencies current, so security fixes arrive as reviewable PRs.
# nusick-dsp is pinned to a git commit on purpose; bump it by hand after reviewing Nusick.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
