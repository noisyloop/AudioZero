[package]
name = "audiozero-visuals"
description = "Audio-reactive visuals for AudioZero: analysis, looks and video export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

publish = false

[lints]
workspace = true

[dependencies]
audiozero-engine = { path = "../audiozero-engine" }
png = "0.17.16"
bytes = "1"
# Built-in MP4 export, so sharing a video needs no FFmpeg: H.264 from Cisco's OpenH264 (compiled
# from source into the app), AAC-LC from a pure-Rust encoder, and an MP4 writer.
openh264 = { version = "0.9.10", default-features = false, features = ["source"] }
mp4 = "0.14.0"
oxideav-aac = "0.1.7"
