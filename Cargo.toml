[workspace]
resolver = "3"
members = ["crates/audiozero-engine", "crates/audiozero-host", "crates/audiozero-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/noisyloop/AudioZero"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1
