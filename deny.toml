# cargo-deny config: `cargo deny check advisories bans sources` (run in CI).
# Same policy as Nusick's deny.toml. See docs/SECURITY_REVIEW.md, "Rust app review".

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
# A yanked crate was withdrawn by its author, usually for a bug or a security problem.
yanked = "deny"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# nusick-dsp is pinned to a commit (crates/audiozero-engine/Cargo.toml).
allow-git = ["https://github.com/noisyloop/Nusick"]
