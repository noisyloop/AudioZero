name: Windows and Linux build
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DAUDIOZERO_BUILD_TESTS=ON
      - name: Build AudioZero, Operator VST3 and tests
        run: cmake --build build --config Release --parallel 4
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: AudioZero-Windows
          path: |
            build/AudioZero_artefacts/Release/AudioZero.exe
            build/AudioZeroOperator_artefacts/Release/VST3/
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libxext-dev \
            libgl1-mesa-dev xvfb
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAUDIOZERO_BUILD_TESTS=ON
      - name: Build AudioZero, Operator VST3 and tests
        run: cmake --build build --parallel 4
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: Screenshot the real UI
        run: xvfb-run -a -s "-screen 0 1920x1200x24" build/AudioZero_artefacts/Release/AudioZero --screenshot linux-ui.png --tab devices
      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: AudioZero-Linux
          path: |
            build/AudioZero_artefacts/Release/AudioZero
            build/AudioZeroOperator_artefacts/Release/VST3/
            linux-ui.png
          if-no-files-found: error
