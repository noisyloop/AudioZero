name: macOS build and DMG
# macOS minutes count 10x against the Actions allowance, so this runs only on main
# and on demand (Actions tab > "Run workflow"). Windows/Linux cover pull requests.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_BUILD_TYPE=Release -DAUDIOZERO_BUILD_TESTS=ON
      - name: Build AudioZero, Operator VST3 and tests
        run: cmake --build build --config Release --parallel 4
      - name: Tests (engine, Operator, VST3 hosting)
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package unsigned DMG
        shell: bash
        run: |
          set -euo pipefail
          APP="build/AudioZero_artefacts/Release/AudioZero.app"
          test -d "$APP"
          mkdir -p dist/dmg-root
          ditto "$APP" "dist/dmg-root/AudioZero.app"
          ln -s /Applications "dist/dmg-root/Applications"
          hdiutil create -volname "AudioZero" -srcfolder "dist/dmg-root" -ov -format UDZO "dist/AudioZero-macOS-unsigned.dmg"
          hdiutil verify "dist/AudioZero-macOS-unsigned.dmg"
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: AudioZero-macOS-DMG-unsigned
          path: dist/AudioZero-macOS-unsigned.dmg
          if-no-files-found: error
      - name: Upload Operator VST3
        uses: actions/upload-artifact@v4
        with:
          name: AudioZero-Operator-VST3-macOS
          path: build/AudioZeroOperator_artefacts/Release/VST3/
          if-no-files-found: error
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: AudioZero-macOS-app-unsigned
          path: build/AudioZero_artefacts/Release/AudioZero.app
          if-no-files-found: error
