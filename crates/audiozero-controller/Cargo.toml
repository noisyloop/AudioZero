[package]
name = "audiozero-controller"
description = "Game controllers (PS4 DualShock 4 first) as a playable instrument for AudioZero, plus a local diagnostic tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

publish = false

[lints]
workspace = true

[dependencies]
audiozero-engine = { path = "../audiozero-engine" }
gilrs = "0.11.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bin]]
name = "audiozero-controller"
path = "src/bin/audiozero-controller.rs"
